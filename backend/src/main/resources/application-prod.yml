# =============================================
# Boki — Production Profile
# =============================================

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/boki}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    show-sql: false

  flyway:
    clean-disabled: true

logging:
  level:
    com.boki: INFO
    org.springframework: WARN
    org.hibernate: WARN
