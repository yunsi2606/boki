name: boki

services:
  # ==============================================================================
  # Boki Spring Boot Backend Service
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: boki/backend:latest
    container_name: boki-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -XX:+ExitOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
    # Secure port binding: only binds to host localhost, preventing direct public exposure
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          memory: 512M
    networks:
      - boki-backend-net

  # ==============================================================================
  # Cloudflare Tunnel Service (Secure Ingress from Vercel)
  # ==============================================================================
  cloudflared:
    image: boki/cloudflared:latest
    container_name: boki-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol quic run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
    # Security Hardening: Principle of least privilege
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - boki-backend-net

  # ==============================================================================
  # Optional Local PostgreSQL (Only active when using profile 'local-db')
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: boki-postgres
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boki}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - boki_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - boki-backend-net

# ==============================================================================
# Isolated Internal Network & Volumes
# ==============================================================================
networks:
  boki-backend-net:
    driver: bridge
    name: boki-backend-net

volumes:
  boki_postgres_data:
    name: boki_postgres_data
